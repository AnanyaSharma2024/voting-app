<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote — Matdan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="tricolor-topbar"></div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-emblem"></div>
            <div class="nav-brand">
                <span class="nav-brand-title">MATDAN</span>
                <span class="nav-brand-sub">Digital Voting Platform — India</span>
            </div>
        </div>
        <button class="menu-icon" onclick="toggleMenu()">&#9776;</button>
        <div class="nav-right" id="navMenu">
            <a href="index.html">Home</a>
            <a href="admin.html" class="admin-only" style="display:none;">Admin</a>
            <a href="result.html">Results</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="page-hero">
        <div class="live-badge">Live Voting Open — Matdan Jaari Hai</div>
        <h1 class="page-title">Cast Your <span class="accent">Vote</span></h1>
        <p class="page-subtitle">Select a candidate below — your vote is final</p>
        <span class="hindi-tagline">उम्मीदवार चुनें — आपका वोट अंतिम है</span>
        <div class="tricolor-bar" style="margin-top:18px;"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>

    <div id="candidateList" class="candidate-container"></div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:3000", { transports: ["websocket"] });

        const token = localStorage.getItem("token");
        if (!token) {
            showToast("Please login first", "error");
            setTimeout(() => window.location.href = "login.html", 1500);
        }

        async function loadCandidates() {
            const list = document.getElementById("candidateList");
            list.innerHTML = [1,2,3].map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line mid"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line btn"></div>
                </div>`).join('');

            try {
                const candidates = await apiRequest("/candidate", "GET", null, true);
                list.innerHTML = "";

                if (!candidates.length) {
                    list.innerHTML = `<div class="empty-state"><div class="empty-line"></div><p>No candidates available yet</p></div>`;
                    return;
                }

                candidates.forEach((c, i) => {
                    const div = document.createElement("div");
                    div.classList.add("candidate-card");
                    div.style.animation = `fadeUp 0.45s ease ${i * 0.1}s both`;
                    div.innerHTML = `
                        <div class="ballot-number">${String(i + 1).padStart(2,'0')}</div>
                        <div class="party-row">
                            <span class="party-label-text">Party / Dal — दल</span>
                            <span class="party-name-text">${c.party}</span>
                        </div>
                        <h3>${c.name}</h3>
                        <div class="candidate-meta">
                            <span class="meta-chip">Age ${c.age}</span>
                            <span class="meta-chip">Candidate</span>
                        </div>
                        <div class="vote-tally">
                            <span class="vote-tally-num">${c.voteCount}</span>
                            <span class="vote-tally-label">Total Votes / Kul Mat</span>
                        </div>
                        <button class="vote-btn" onclick="vote('${c._id}', this)">Vote for ${c.name.split(' ')[0]}</button>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        async function vote(candidateId, btn) {
            btn.disabled = true;
            btn.textContent = "Recording...";
            try {
                const response = await apiRequest(`/candidate/vote/${candidateId}`, "POST", null, true);
                showToast(response.message + " — Jai Hind!", "success");
                setTimeout(loadCandidates, 900);
            } catch (err) {
                showToast(err.message, "error");
                btn.disabled = false;
                btn.textContent = "Vote";
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('show');
        }

        socket.on("voteUpdated", () => loadCandidates());
        window.onload = loadCandidates;
    </script>
</body>
</html>
