<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Matdan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="tricolor-topbar"></div>

    <nav class="navbar">
        <div class="nav-left">
            <div class="nav-emblem"></div>
            <div class="nav-brand">
                <span class="nav-brand-title">MATDAN</span>
                <span class="nav-brand-sub">Digital Voting Platform — India</span>
            </div>
        </div>
        <button class="menu-icon" onclick="toggleMenu()">&#9776;</button>
        <div class="nav-right" id="navMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html" class="active">Register</a>
            <a href="result.html">Results</a>
        </div>
    </nav>

    <div class="auth-wrapper" style="padding: 40px 24px;">
        <div class="auth-container" style="max-width: 520px;">
            <h1>Register</h1>
            <p class="auth-subtitle">पंजीकरण करें — Create your voter account</p>

            <div class="input-group">
                <label class="input-label">Full Name / पूरा नाम</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="input-group">
                    <label class="input-label">Age / उम्र</label>
                    <input type="number" id="age" placeholder="Age (18+)" min="18">
                </div>
                <div class="input-group">
                    <label class="input-label">Role / भूमिका</label>
                    <select id="role">
                        <option value="voter" selected>Voter — मतदाता</option>
                        <option value="admin">Admin — प्रशासक</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Address / पता</label>
                <input type="text" id="address" placeholder="Full residential address">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="input-group">
                    <label class="input-label">Email <span style="opacity:0.4; font-size:9px; letter-spacing:1px;">OPTIONAL</span></label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>
                <div class="input-group">
                    <label class="input-label">Mobile <span style="opacity:0.4; font-size:9px; letter-spacing:1px;">OPTIONAL</span></label>
                    <input type="text" id="mobile" placeholder="10-digit number">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Aadhar Card Number / आधार संख्या</label>
                <input type="text" id="aadhar" placeholder="12-digit Aadhar number" maxlength="12">
            </div>

            <div class="input-group">
                <label class="input-label">Password / पासवर्ड</label>
                <input type="password" id="password" placeholder="Create a strong password">
            </div>

            <button onclick="signup()">Create Account</button>

            <p>Already registered? / पहले से पंजीकृत? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('show');
        }
    </script>
</body>
</html>
